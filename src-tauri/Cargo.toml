[package]
name = "rccui-tauri"
version = "0.1.0"
description = "RCCUI - Multi Coding Agent Desktop App"
authors = ["lzmcoding"]
edition = "2024"

[lib]
name = "rccui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
base64 = "0.22"
md-5 = "0.10"
mime_guess = "2"
glob = "0.3"
dashmap = "6"
dirs = "6"
hex = "0.4"
url = "2"
regex = "1"

# File watching
notify = "7"
notify-debouncer-mini = "0.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# PTY (pseudo-terminal)
portable-pty = "0.9"

# Async utilities
async-trait = "0.1"

